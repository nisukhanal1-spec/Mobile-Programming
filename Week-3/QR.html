<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            text-align: center;
            padding: 40px;
        }

        .profile-card {
            width: 300px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .profile-card img.profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #qrCode {
            display: none;
            margin-top: 15px;
        }

        #qrCode img {
            width: 120px;
        }
    </style>
</head>
<body>
<div class="profile-card" id="profileCard">

        <img 
            class="profile" 
            src="https://cdn.phototourl.com/free/2026-09-16-ceca599f-a100-4555-af45-5787ad17e9e8.jpg" 
            alt="Profile Image"
        >

        <h2 id="displayName">Your Name</h2>
        <p id="displayAddress">Your Address</p>

        <input 
            type="text" 
            id="name" 
            placeholder="Enter your name"
        >

        <input 
            type="text" 
            id="address" 
            placeholder="Enter your address"
        >

        <br>

        <button id="qrButton">
            Show QR Code
        </button>

        <div id="qrCode">
            <img 
                src="https://tse1.mm.bing.net/th/id/OIP.x1rG101-okyo1Bi3y2QErwHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
                alt="QR Code"
            >
        </div>

    </div>
    <script>

$(document).ready(function() {

    // Update name and address
    $("#name").change(function() {
        $("#displayName").text($(this).val());
        $("#profileCard").css("background-color", "lightblue");
    });

    $("#address").change(function() {
        $("#displayAddress").text($(this).val());
        $("#profileCard").css("background-color", "lightblue");
    });


    // Show and hide QR code
    $("#qrButton").click(function() {

        $("#qrCode").toggle();

    });

});

</script>
</body>
</html>
